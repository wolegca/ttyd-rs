[package]
name = "ttyd-rs"
version = "1.2.1"
edition = "2024"
authors = ["wcx"]
description = "A Rust rewrite of ttyd - Share your terminal over the web"
license = "AGPL-3.0-only"

[lints.clippy]
unwrap-used = "deny"
expect-used = "deny"
panic = "deny"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
argon2 = "0.6"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
libc = "0.2.189"
mime_guess = "2.0.5"
nix = { version = "0.31.3", features = ["process", "signal", "term", "ioctl", "fs"] }
rust-embed = { version = "8.12.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "full", "io-util"] }
tokio-util = { version = "0.7.19", features = ["io", "rt"] }
toml = "1.1.4"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.0", features = ["v4"] }
rand = "0.10.2"
shlex = "2.0.1"

[features]
default = []

[dev-dependencies]
flate2 = "1.1.9"
tokio-tungstenite = "0.30.0"

[profile.release]
lto = true
opt-level = "s"
strip = "symbols"
panic = "abort"
codegen-units = 1
