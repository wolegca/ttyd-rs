# ttyd-rs Configuration File
# This is an example configuration file for ttyd-rs
# Copy this file to config.toml and modify as needed
#
# All sections and fields are optional. Any that are omitted fall back to
# the built-in default, so a minimal file with just `bind` and `command`
# works. Unknown fields and sections, however, are rejected at startup —
# remove unused keys rather than leaving them in. The one caveat: file
# transfer is enabled by default, so without an [auth] section the server
# refuses to start unless you set `[file_transfer] enabled = false` (see
# the note below).
#
# Validate a configuration without starting the server:
#   ttyd-rs -t --config /path/to/config.toml

# Server configuration
bind = "127.0.0.1:7681"
max_connections = 100
# Log level: bare level name ("trace", "debug", "info", "warn", "error",
# "off", case-insensitive) or an EnvFilter directive containing "="
# (e.g. "ttyd_rs=debug"). Invalid values refuse startup.
log_level = "info"

# Trust proxy headers (default: false)
# Set to true to read real client IP from X-Real-IP / X-Forwarded-For
# headers when behind a reverse proxy (nginx, Caddy, etc.).
# Only enable this when you trust the proxy to set these headers correctly.
# trust_proxy = false

# Refuse unauthenticated terminals on non-loopback addresses by default.
# Set this only when a trusted reverse proxy enforces authentication before
# forwarding traffic to ttyd-rs. It does not enable file transfer without
# authentication; that requires the separate setting below.
# allow_unauthenticated = false

# Terminal command to execute
command = ["bash", "-l"]

# Working directory (optional)
# working_dir = "/home/user"

# Session configuration
[session]
# Session mode: "isolated", "shared_readonly", or "shared_readwrite"
# - isolated: Each client gets its own PTY (default)
# - shared_readonly: Multiple clients share one PTY, read-only
# - shared_readwrite: Multiple clients share one PTY, all can write
mode = "isolated"

# Session timeout in seconds (0 = no timeout)
timeout = 3600

# Reconnect window in seconds — how long to keep empty sessions alive
# for client reconnection (default: 60)
# reconnect_window = 60

# Authentication configuration (optional)
[auth]
method = "basic"  # "basic" or "token"
username = "admin"

# Recommended: store an Argon2id PHC hash instead of the plaintext password,
# so the plaintext never appears in this file (which may be backed up,
# synced, or packaged into images). Generate one and paste the output here:
#
#   printf 'your-password\n' | ttyd-rs --hash-password
#
# (interactive: run `ttyd-rs --hash-password`; you will be prompted)
password = "$argon2id$v=19$m=19456,t=2,p=1$REPLACE_WITH_YOUR_GENERATED_HASH"

# Plaintext passwords are still accepted for backward compatibility, but
# trigger a startup warning recommending migration to the hash above:
# password = "changeme"
#
# Note: any value starting with `$argon2id$` is treated as a pre-hashed
# credential and validated at startup, so a literal plaintext password that
# happens to begin with that prefix is not supported.

# Audit logging configuration
[audit]
enabled = true
log_file = "/var/log/ttyd-rs/audit.log"  # Optional, if not set, logs to stdout only

# Input validation configuration
[validation]
max_cols = 500
min_cols = 10
max_rows = 200
min_rows = 5
max_input_size = 16384           # 16KB
max_credentials_length = 1024

# Rate limiting configuration
[rate_limit]
max_requests = 10
window_seconds = 60

# File transfer configuration
[file_transfer]
enabled = true
# Base directory for file operations (defaults to process working directory)
# dir = "/tmp/uploads"
# Maximum upload file size in bytes (default: 100MB)
max_upload_size = 104857600
#
# SAFETY: when `auth` above is commented out (no authentication), file
# endpoints would be open to unauthenticated clients. The server refuses to
# start in that combination unless you explicitly set this to true — only do
# so for trusted, loopback-only deployments:
# allow_unauthenticated = false

# HTTP response compression (gzip) for static assets (default: enabled)
# Only applies to static files (index.html, xterm.js, etc.) — API and
# WebSocket responses are never compressed. Already-compressed formats
# (font/*, image/x-icon) are skipped to avoid wasted CPU and size bloat.
[compression]
enabled = true
# gzip level: 1 = fastest, 9 = best compression (default: 6)
level = 6
