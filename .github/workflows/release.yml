name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: ttyd-rs

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "Tag version ($tag_version) does not match Cargo.toml version ($package_version)" >&2
            exit 1
          }

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="${BINARY_NAME}-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          staging="dist/${BINARY_NAME}-v${version}-x86_64-unknown-linux-gnu"
          mkdir -p "$staging"
          cp "target/release/${BINARY_NAME}" "$staging/"
          cp LICENSE README.md "$staging/"
          tar -C dist -czf "dist/$archive" "${BINARY_NAME}-v${version}-x86_64-unknown-linux-gnu"
          (cd dist && sha256sum "$archive") > "dist/$archive.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/release/${{ env.BINARY_NAME }}
            dist/${{ env.BINARY_NAME }}-v*.tar.gz
            dist/${{ env.BINARY_NAME }}-v*.tar.gz.sha256
