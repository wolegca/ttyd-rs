            if (fontSize !== DEFAULT_FONT_SIZE) { fontSize = DEFAULT_FONT_SIZE; applyFontSize(); }
        }

        document.getElementById('btn-font-inc').addEventListener('click', zoomIn);
        document.getElementById('btn-font-dec').addEventListener('click', zoomOut);
        document.getElementById('btn-font-reset').addEventListener('click', resetFont);

        // Keyboard zoom (Ctrl/Cmd + = / - / 0)
        window.addEventListener('keydown', (e) => {
            const mod = e.ctrlKey || e.metaKey;
            if (!mod) return;
            if (e.key === '=' || e.key === '+') { e.preventDefault(); zoomIn(); }
            else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomOut(); }
            else if (e.key === '0') { e.preventDefault(); resetFont(); }
        });

        // ============================================================
        // Cursor blink toggle (persisted)
        // ============================================================
        const cursorBlinkToggle = document.getElementById('cursor-blink-toggle');
        cursorBlinkToggle.checked = cursorBlink;
        cursorBlinkToggle.addEventListener('change', () => {
            cursorBlink = cursorBlinkToggle.checked;
            term.options.cursorBlink = cursorBlink;
            localStorage.setItem('ttyd.cursorBlink', String(cursorBlink));
        });

        // ============================================================
        // Fullscreen
        // ============================================================
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const FS_ENTER_SVG = '<svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5H2.5V6M10 2.5h3.5V6M10 13.5h3.5V10M6 13.5H2.5V10"/></svg>';
        const FS_EXIT_SVG = '<svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5V6H2.5M10 2.5V6h3.5M13.5 10h-3.5V13.5M2.5 10h3.5v3.5"/></svg>';

        function setFullscreenIcon(isFullscreen) {
            btnFullscreen.innerHTML = isFullscreen ? FS_EXIT_SVG : FS_ENTER_SVG;
            btnFullscreen.title = isFullscreen ? 'Exit fullscreen' : 'Toggle fullscreen';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                const p = document.documentElement.requestFullscreen();
                if (p && p.catch) p.catch(() => {});
            } else {
                const p = document.exitFullscreen();
                if (p && p.catch) p.catch(() => {});
            }
        }
        btnFullscreen.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', () => {
            setFullscreenIcon(!!document.fullscreenElement);
            setTimeout(() => { fitAddon.fit(); sendResize(); }, 120);
        });

        // ============================================================
        // Copy selection
        // ============================================================
        term.onSelectionChange(() => {
            const hasSel = term.hasSelection();
            copyBtn.classList.toggle('visible', !!hasSel);
        });
        copyBtn.addEventListener('click', async () => {
            const sel = term.getSelection();
            if (!sel) return;
            try {
                await navigator.clipboard.writeText(sel);
                showToast('Copied to clipboard', 'success');
            } catch (e) {
                // Fallback for older browsers / non-secure contexts
                try {
                    const ta = document.createElement('textarea');
                    ta.value = sel;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('Copied to clipboard', 'success');
                } catch (_) {
                    showToast('Copy failed', 'error');
                }
            }
        });

        // ============================================================
        // Mobile special-key toolbar
        // ============================================================
        const MOBILE_KEY_SEQUENCES = {
            Escape: '\x1b',
            Tab: '\t',
            ArrowUp: '\x1b[A',
            ArrowDown: '\x1b[B',
            ArrowRight: '\x1b[C',
            ArrowLeft: '\x1b[D',
            CtrlC: '\x03',
            CtrlD: '\x04',
            CtrlL: '\x0c',
            PageUp: '\x1b[5~',
            PageDown: '\x1b[6~'
        };
        document.getElementById('mobile-keys').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-key]');
            if (!btn) return;
            if (serverDisconnected || readOnly) return;
            const seq = MOBILE_KEY_SEQUENCES[btn.dataset.key];
            if (seq) sendMsg('input', { payload: seq });
        });

        // ============================================================
        // Toast notifications
        // ============================================================
        const toastContainer = document.getElementById('toast-container');
        const TOAST_ICONS = { success: ICONS.toastSuccess, error: ICONS.toastError, info: ICONS.toastInfo };

        /**
         * Show a toast notification.
         * @param {string} message
         * @param {'success'|'error'|'info'} [type='success']
         * @param {number} [duration=4000]
         */
        function showToast(message, type = 'success', duration = 4000) {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            const icon = document.createElement('span');
            icon.className = 'toast-icon';
            icon.innerHTML = TOAST_ICONS[type] || TOAST_ICONS.info;
            const text = document.createElement('span');
            text.className = 'toast-text';
            text.textContent = message;
            el.appendChild(icon);
            el.appendChild(text);
            toastContainer.appendChild(el);
            setTimeout(() => {
                el.classList.add('fade-out');
                setTimeout(() => el.remove(), 300);
            }, duration);
        }

        // ============================================================
        // Upload progress bar
        // ============================================================
        const uploadProgress = document.getElementById('upload-progress');
        const uploadProgressBar = document.getElementById('upload-progress-bar');

        function setUploadProgress(percent) {
            uploadProgress.classList.remove('hidden');
            uploadProgressBar.style.width = percent + '%';
        }

        function hideUploadProgress() {
            uploadProgress.classList.add('hidden');
            uploadProgressBar.style.width = '0%';
        }

        // ============================================================
        // Dropdown menus (settings + files)
        // ============================================================
        const menuWrapper = document.getElementById('menu-wrapper');
        const btnMenu = document.getElementById('btn-menu');
        const menuDropdown = document.getElementById('menu-dropdown');
        const settingsWrapper = document.getElementById('settings-wrapper');
        const btnSettings = document.getElementById('btn-settings');
        const settingsMenu = document.getElementById('settings-menu');

        function closeAllMenus() {
            menuDropdown.classList.remove('open');
            settingsMenu.classList.remove('open');
        }

        btnMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            const willOpen = !menuDropdown.classList.contains('open');
            closeAllMenus();
            if (willOpen) menuDropdown.classList.add('open');
        });

        btnSettings.addEventListener('click', (e) => {
            e.stopPropagation();
            const willOpen = !settingsMenu.classList.contains('open');
            closeAllMenus();
            if (willOpen) settingsMenu.classList.add('open');
        });

        // Close menus on any outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#menu-wrapper') && !e.target.closest('#settings-wrapper')) {
                closeAllMenus();
            }
        });

        // Menu item clicks close the menu
        menuDropdown.addEventListener('click', (e) => {
            if (e.target.closest('.menu-item')) closeAllMenus();
        });
        settingsMenu.addEventListener('click', (e) => {
            if (e.target.closest('.menu-item')) closeAllMenus();
        });

        const btnClear = document.getElementById('btn-clear');
        btnClear.addEventListener('click', () => {
            term.clear();
            closeAllMenus();
        });

        function setMenuVisible(visible) {
            if (visible) {
                menuWrapper.classList.remove('hidden');
            } else {
                menuWrapper.classList.add('hidden');
                menuDropdown.classList.remove('open');
            }
        }

        // ============================================================
        // Custom confirm modal (styled, replaces window.confirm)
        // ============================================================
        const confirmOverlay = document.getElementById('confirm-overlay');
        const confirmBox = document.getElementById('confirm-box');
        const confirmMessage = document.getElementById('confirm-message');
        const confirmOk = document.getElementById('confirm-ok');
        const confirmCancel = document.getElementById('confirm-cancel');

        /**
         * Show a styled confirm dialog matching the app's theme.
         * @param {string} message
         * @param {string} [okLabel='Overwrite']
         * @returns {Promise<boolean>}
         */
        function showConfirm(message, okLabel = 'Overwrite') {
            confirmMessage.textContent = message;
            confirmOk.textContent = okLabel;
            confirmOverlay.classList.remove('hidden');
            requestAnimationFrame(() => confirmOk.focus());
            return new Promise((resolve) => {
                function cleanup(result) {
                    confirmOverlay.classList.add('hidden');
                    confirmOk.removeEventListener('click', onOk);
                    confirmCancel.removeEventListener('click', onCancel);
                    resolve(result);
                }
                function onOk() { cleanup(true); }
                function onCancel() { cleanup(false); }
                confirmOk.addEventListener('click', onOk);
                confirmCancel.addEventListener('click', onCancel);
            });
        }

        // ============================================================
        // Escape-key handling (menus + modals, without stealing terminal Esc)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (menuDropdown.classList.contains('open') || settingsMenu.classList.contains('open')) {
                closeAllMenus();
            } else if (!confirmOverlay.classList.contains('hidden')) {
                confirmCancel.click();
            } else if (!filePanelOverlay.classList.contains('hidden')) {
                filePanelOverlay.classList.add('hidden');
            }
            // Otherwise, let xterm handle Esc (send to terminal).
        });

        // ============================================================
        // File Upload (with progress via XHR)
        // ============================================================
        const btnUpload = document.getElementById('btn-upload');
        const btnDownload = document.getElementById('btn-download');
        const uploadInput = document.getElementById('upload-input');

        /** @type {File[]} */
        let uploadQueue = [];
        let uploadQueueTotal = 0;
        /** Maximum upload size in bytes (from server config, null if not set) */
        let maxUploadSize = null;

        /** Queue files for sequential upload.
         *  @param {File[]|FileList} files
         */
        function queueUploads(files) {
            const list = Array.from(files);
            if (list.length === 0) return;
            uploadQueue.push(...list);
            uploadQueueTotal += list.length;
            if (list.length > 1) {
                showToast(`Queued ${list.length} files for upload`, 'info');
            }
            if (!btnUpload.disabled) {
                processUploadQueue();
            }
        }

        function processUploadQueue() {
            if (uploadQueue.length === 0) {
                uploadQueueTotal = 0;
                return;
            }
            const next = uploadQueue.shift();
            uploadFile(next);
        }

        /**
         * Check if a file already exists on the server.
         * @param {string} filename
         * @returns {Promise<boolean>}
         */
        async function checkFileExists(filename) {
            try {
                const url = '/api/files/list?session_id=' + encodeURIComponent(currentSessionId || '');
                const headers = {};
                const authHeader = getAuthHeader();
                if (authHeader) headers['Authorization'] = authHeader;
                const resp = await fetch(url, { headers });
                if (!resp.ok) return false;
                const data = await resp.json();
                return data.entries.some(e => e.name === filename);
            } catch {
                return false; // If we can't check, let the server handle it
            }
        }

        /**
         * Upload a file with progress tracking.
         * @param {File} file
         * @param {boolean} [overwrite=false]
         */
        async function uploadFile(file, overwrite = false) {
            // Pre-flight: check file size against server limit
            if (maxUploadSize && file.size > maxUploadSize) {
                showToast(`${file.name}: file size (${formatSize(file.size)}) exceeds limit (${formatSize(maxUploadSize)})`, 'error');
                processUploadQueue();
                return;
            }

            // Pre-flight: check if file already exists to avoid ERR_CONNECTION_ABORTED
            if (!overwrite) {
                const exists = await checkFileExists(file.name);
                if (exists) {
                    const ok = await showConfirm(`"${file.name}" already exists. Overwrite it?`);
                    if (ok) {
                        uploadFile(file, true);
                    } else {
                        processUploadQueue();
                    }
                    return;
                }
            }

            btnUpload.disabled = true;
            const position = uploadQueueTotal - uploadQueue.length;
            btnUpload.textContent = uploadQueueTotal > 1
                ? `Uploading ${position}/${uploadQueueTotal}...`
                : 'Uploading...';
            setUploadProgress(0);

            const xhr = new XMLHttpRequest();
            const formData = new FormData();
            formData.append('file', file);

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    setUploadProgress(pct);
                }
            });

            xhr.addEventListener('load', () => {
                hideUploadProgress();
                btnUpload.disabled = false;
                btnUpload.innerHTML =
                    '<span class="menu-item-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3M8 3L5 6M8 3l3 3M3 13h10"/></svg></span>Upload files';
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        showToast(`Uploaded: ${data.filename} (${formatSize(data.size)})`, 'success');
                    } catch (_) {
                        showToast('Upload complete', 'success');
                    }
                    processUploadQueue();
                } else if (xhr.status === 409) {
                    showConfirm(`"${file.name}" already exists. Overwrite it?`).then((ok) => {
                        if (ok) {
                            uploadFile(file, true);
                        } else {
                            processUploadQueue();
                        }
                    });
                } else {
                    let errMsg = `Upload failed (${xhr.status})`;
                    try {
                        const err = JSON.parse(xhr.responseText);
                        errMsg = err.error || errMsg;
                    } catch (_) {}
                    showToast(`${file.name}: ${errMsg}`, 'error');
                    processUploadQueue();
                }
            });

            xhr.addEventListener('error', () => {
                hideUploadProgress();
                btnUpload.disabled = false;
                btnUpload.innerHTML =
                    '<span class="menu-item-icon"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3M8 3L5 6M8 3l3 3M3 13h10"/></svg></span>Upload files';
                showToast(`${file.name}: upload failed (network error)`, 'error');
                processUploadQueue();
            });

            let url = '/api/files/upload?session_id=' + encodeURIComponent(currentSessionId || '');
            if (overwrite) url += '&overwrite=true';
            xhr.open('POST', url);
            const authHeader = getAuthHeader();
            if (authHeader) xhr.setRequestHeader('Authorization', authHeader);
            xhr.send(formData);
        }

        /**
         * Build the Authorization header value from current credentials.
         * @returns {string|null}
         */
        function getAuthHeader() {
            if (!authRequired || !authCredentials || !authCredentials.credentials) return null;
            if (authCredentials.method === 'basic') {
                return 'Basic ' + authCredentials.credentials;
            } else if (authCredentials.method === 'token') {
                return 'Bearer ' + authCredentials.credentials;
            }
            return null;
        }

        /**
         * Format byte size to human-readable string.
         * @param {number} bytes
         * @returns {string}
         */
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        /** Escape a string for safe insertion into HTML.
         *  @param {string} s
         *  @returns {string}
         */
        function escapeHtml(s) {
            // Entity strings are built from char codes so they can never be
            // altered by any HTML-entity decoding applied to this file.
            const ENT = {
                '&': String.fromCharCode(38, 97, 109, 112, 59),      // amp
                '<': String.fromCharCode(38, 108, 116, 59),          // lt
                '>': String.fromCharCode(38, 103, 116, 59),          // gt
                '"': String.fromCharCode(38, 113, 117, 111, 116, 59), // quot
                "'": String.fromCharCode(38, 35, 51, 57, 59)         // apos
            };
            return String(s).replace(/[&<>"']/g, (c) => ENT[c]);
        }

        btnUpload.addEventListener('click', () => {
            uploadInput.click();
        });

        uploadInput.addEventListener('change', () => {
            if (!uploadInput.files || uploadInput.files.length === 0) return;
            queueUploads(uploadInput.files);
            uploadInput.value = '';
        });

        // ============================================================
        // File List Panel
        // ============================================================
        const filePanelOverlay = document.getElementById('file-panel-overlay');
        const filePanelBody = document.getElementById('file-panel-body');
        const filePanelClose = document.getElementById('file-panel-close');
        const filePanelRefresh = document.getElementById('file-panel-refresh');
        const filePanelBreadcrumb = document.getElementById('file-panel-breadcrumb');
        const showHiddenToggle = document.getElementById('show-hidden-toggle');
        // Restore persisted "show hidden" preference (default: unchecked)
        showHiddenToggle.checked = localStorage.getItem('ttyd.showHidden') === 'true';
        let currentFilePath = '.';
        let loadingTimer = null;
        showHiddenToggle.addEventListener('change', () => {
            // Persist the "show hidden" preference, then refresh the listing
            localStorage.setItem('ttyd.showHidden', String(showHiddenToggle.checked));
            showLoading();
            requestFileList(currentFilePath);
        });

        btnDownload.addEventListener('click', () => {
            openFilePanel();
        });

        filePanelClose.addEventListener('click', () => {
            filePanelOverlay.classList.add('hidden');
        });

        filePanelRefresh.addEventListener('click', () => {
            showLoading();
            requestFileList(currentFilePath);
        });

        filePanelOverlay.addEventListener('click', (e) => {
            if (e.target === filePanelOverlay) {
                filePanelOverlay.classList.add('hidden');
            }
        });

        // Show the loading spinner, but only after a short delay. If the
        // listing arrives quickly we keep the previous content and render the
        // new list directly — this avoids the spinner flashing for a few ms
        // (the "flicker" seen on fast loads). Slow loads still get feedback.
        const LOADING_DELAY = 250;
        function showLoading() {
            if (loadingTimer !== null) return; // already pending
            loadingTimer = setTimeout(() => {
                loadingTimer = null;
                filePanelBody.innerHTML = '<div class="fp-loading"><div class="spinner"></div>Loading...</div>';
            }, LOADING_DELAY);
        }

        function cancelLoading() {
            if (loadingTimer !== null) {
                clearTimeout(loadingTimer);
                loadingTimer = null;
            }
        }

        function renderBreadcrumb(path) {
            filePanelBreadcrumb.innerHTML = '';
            const rootCrumb = document.createElement('span');
            rootCrumb.className = 'crumb';
            rootCrumb.textContent = '~';
            rootCrumb.addEventListener('click', () => {
                showLoading();
                requestFileList('.');
            });
            filePanelBreadcrumb.appendChild(rootCrumb);

            if (path === '.' || path === '') return;
            const parts = path.split('/').filter(Boolean);
            let accum = '';
            parts.forEach((part) => {
                accum = accum ? accum + '/' + part : part;
                const sep = document.createElement('span');
                sep.className = 'sep';
                sep.textContent = '/';
                filePanelBreadcrumb.appendChild(sep);

                const crumb = document.createElement('span');
                crumb.className = 'crumb';
                crumb.textContent = part;
                const target = accum;
                crumb.addEventListener('click', () => {
                    showLoading();
                    requestFileList(target);
                });
                filePanelBreadcrumb.appendChild(crumb);
            });
        }

        function requestFileList(path) {
            currentFilePath = path || '.';
            renderBreadcrumb(currentFilePath);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'file_list', data: { path: currentFilePath, show_hidden: showHiddenToggle.checked } }));
            } else {
                cancelLoading();
                filePanelBody.innerHTML = '<div class="fp-empty">Not connected</div>';
            }
        }

        function openFilePanel() {
            filePanelOverlay.classList.remove('hidden');
            showLoading();
            requestFileList('.');
            requestAnimationFrame(() => filePanelClose.focus());
        }

        function joinPath(base, name) {
            if (base === '.' || base === '') return name;
            return base + '/' + name;
        }

        function parentPath(path) {
            if (path === '.' || path === '') return null;
            const idx = path.lastIndexOf('/');
            return idx > 0 ? path.substring(0, idx) : '.';
        }

        function renderFileList(data) {
            cancelLoading();
            const files = data.entries || [];
            filePanelBody.innerHTML = '';

            // ".." entry to go up
            const parent = parentPath(currentFilePath);
            if (parent !== null) {
                const upItem = document.createElement('div');
                upItem.className = 'file-item is-parent';
                const upIcon = document.createElement('span');
                upIcon.className = 'file-icon';
                upIcon.innerHTML = ICONS.up;
                const upName = document.createElement('span');
                upName.className = 'file-item-name';
                upName.textContent = '..';
                upItem.appendChild(upIcon);
                upItem.appendChild(upName);
                upItem.addEventListener('click', () => {
                    showLoading();
                    requestFileList(parent);
                });
                filePanelBody.appendChild(upItem);
            }

            if (files.length === 0 && parent === null) {
                filePanelBody.innerHTML =
                    '<div class="fp-empty"><div class="empty-icon">&#128193;</div>No files in current directory</div>';
                return;
            }

            files.forEach(f => {
                const item = document.createElement('div');
                item.className = 'file-item' + (f.is_dir ? ' is-dir' : '');

                const icon = document.createElement('span');
                icon.className = 'file-icon';
                icon.innerHTML = f.is_dir ? ICONS.dir : ICONS.file;

                const name = document.createElement('span');
                name.className = 'file-item-name';
                name.textContent = f.name;
                name.title = f.name;

                const meta = document.createElement('span');
                meta.className = 'file-item-meta';
                meta.textContent = f.is_dir ? 'DIR' : formatSize(f.size);

                item.appendChild(icon);
                item.appendChild(name);
                item.appendChild(meta);

                if (f.is_dir) {
                    item.addEventListener('click', () => {
                        showLoading();
                        requestFileList(joinPath(currentFilePath, f.name));
                    });
                } else {
                    const dl = document.createElement('button');
                    dl.className = 'file-item-dl';
                    dl.textContent = 'Download';
                    dl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        triggerDownload(joinPath(currentFilePath, f.name));
                    });
                    item.appendChild(dl);
                }

                filePanelBody.appendChild(item);
            });
        }

        function triggerDownload(filename) {
            const url = '/api/files/download?path=' + encodeURIComponent(filename) + '&session_id=' + encodeURIComponent(currentSessionId || '');
            const headers = {};
            const authHeader = getAuthHeader();
            if (authHeader) headers['Authorization'] = authHeader;

            showToast(`Downloading: ${filename}`, 'info');
            fetch(url, { headers })
                .then(resp => {
                    if (!resp.ok) throw new Error(`Download failed (${resp.status})`);
                    return resp.blob();
                })
                .then(blob => {
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                    showToast(`Downloaded: ${filename}`, 'success');
                })
                .catch(err => {
                    showToast(err.message || 'Download failed', 'error');
                });
        }

        // ============================================================
        // Drag & Drop Upload
        // ============================================================
        const dropOverlay = document.getElementById('drop-overlay');
        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                dropOverlay.classList.remove('hidden');
            }
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                dropOverlay.classList.add('hidden');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropOverlay.classList.add('hidden');
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                queueUploads(files);
            }
        });
    </script>
</body>
</html>
