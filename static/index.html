<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ttyd-rs</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preload" href="/vendor/fonts/0xProtoNerdFontMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/vendor/fonts/0xProtoNerdFontMono-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/vendor/scripts/xterm.css" />
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
    <!-- ============================ Header ============================ -->
    <header id="header">
        <div class="header-left">
            <span class="logo" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6.5l2 1.5-2 1.5M8 10h3.5"/></svg>
            </span>
            <h1>ttyd<span class="brand-accent">-rs</span></h1>
        </div>

        <div class="header-center" id="status">
            <span class="status-indicator" id="status-indicator" aria-hidden="true"></span>
            <span id="status-text" role="status" aria-live="polite">Connecting...</span>
            <span id="readonly-badge" class="badge" title="You cannot type in this session">READ-ONLY</span>
            <span id="session-info"></span>
        </div>

        <div class="header-right">
            <div id="upload-indicator" class="menu-anchor hidden">
                <button id="btn-upload-indicator" class="icon-btn" title="Upload progress" aria-label="Upload progress" aria-haspopup="true">
                    <svg class="ring" viewBox="0 0 16 16" width="17" height="17" fill="none" stroke-width="1.6" stroke-linecap="round">
                        <g class="ring-rot">
                            <circle class="ring-track" cx="8" cy="8" r="6.5" pathLength="100"/>
                            <circle class="ring-fill" cx="8" cy="8" r="6.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
                        </g>
                        <text class="ring-text" x="8" y="8" text-anchor="middle" dominant-baseline="central">0</text>                    </svg>
                </button>
                <div id="upload-panel" class="dropdown" role="dialog" aria-label="Upload progress details">
                    <div id="upload-panel-header">
                        <span id="upload-panel-title">Uploading…</span>
                        <button id="btn-cancel-all">Cancel all</button>
                    </div>
                    <div id="upload-panel-list"></div>
                </div>
            </div>

            <button id="btn-fullscreen" class="icon-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
                <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5H2.5V6M10 2.5h3.5V6M10 13.5h3.5V10M6 13.5H2.5V10"/></svg>
            </button>

            <div id="settings-wrapper" class="menu-anchor">
                <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings" aria-haspopup="true">
                    <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.5h6.5M12.5 4.5H14M2 8h2.5M8 8h6M2 11.5h7.5M12.5 11.5H14"/><circle cx="10.5" cy="4.5" r="1.7" fill="currentColor" stroke="none"/><circle cx="6.5" cy="8" r="1.7" fill="currentColor" stroke="none"/><circle cx="11" cy="11.5" r="1.7" fill="currentColor" stroke="none"/></svg>
                </button>
                <div id="settings-menu" class="dropdown" role="menu" aria-label="Terminal settings">
                    <div class="menu-group">
                        <div class="menu-label">Terminal</div>
                        <div class="menu-row">
                            <span>Font size</span>
                            <div class="menu-controls">
                                <button id="btn-font-dec" class="ctrl-btn" title="Decrease font size" aria-label="Decrease font size">A&minus;</button>
                                <span id="font-size-label" class="font-size-label">14</span>
                                <button id="btn-font-inc" class="ctrl-btn" title="Increase font size" aria-label="Increase font size">A+</button>
                                <button id="btn-font-reset" class="ctrl-btn reset" title="Reset font size">Reset</button>
                            </div>
                        </div>
                        <div class="menu-row">
                            <span>Cursor blink</span>
                            <label class="switch" title="Toggle cursor blink">
                                <input type="checkbox" id="cursor-blink-toggle" aria-label="Toggle cursor blink">
                                <span class="switch-slider"></span>
                            </label>
                        </div>
                    </div>
                    <div class="menu-divider"></div>
                    <div class="menu-group">
                        <div class="menu-label">Notifications</div>
                        <div class="menu-row">
                            <span>Toast duration</span>
                            <div class="menu-controls">
                                <button id="btn-toast-dec" class="ctrl-btn" title="Decrease duration" aria-label="Decrease toast duration">&minus;</button>
                                <input type="number" id="toast-duration-input" class="toast-duration-input"
                                       min="0" step="1" value="4" title="Seconds a notification stays visible; 0 = never hide" />
                                <button id="btn-toast-inc" class="ctrl-btn" title="Increase duration" aria-label="Increase toast duration">+</button>
                                <button id="btn-toast-reset" class="ctrl-btn reset" title="Reset to default (4s)">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="menu-divider"></div>
                    <div class="menu-group">
                        <div class="menu-label">Actions</div>
                        <button id="btn-clear" class="menu-item" role="menuitem">
                            <span class="menu-item-icon">
                                <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M5 4.5l.5 8.5h5l.5-8.5"/></svg>
                            </span>
                            Clear terminal
                        </button>
                    </div>
                </div>
            </div>

            <div id="menu-wrapper" class="menu-anchor hidden">
                <button id="btn-menu" class="icon-btn" title="Files" aria-label="Files menu" aria-haspopup="true">
                    <svg viewBox="0 0 16 16" width="17" height="17" fill="currentColor"><circle cx="8" cy="3.2" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="8" cy="12.8" r="1.5"/></svg>
                </button>
                <div id="menu-dropdown" class="dropdown" role="menu" aria-label="File operations">
                    <button id="btn-upload" class="menu-item" role="menuitem">
                        <span class="menu-item-icon">
                            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3M8 3L5 6M8 3l3 3M3 13h10"/></svg>
                        </span>
                        Upload files
                    </button>
                    <button id="btn-download" class="menu-item" role="menuitem">
                        <span class="menu-item-icon">
                            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M1.5 4.5h4l1.5 1.5h7.5v6h-13Z"/></svg>
                        </span>
                        Browse files
                    </button>
                </div>
                <input type="file" id="upload-input" multiple />
            </div>
        </div>
    </header>

    <!-- ========================= Terminal area ========================= -->
    <div id="terminal-container">
        <!-- Connection banner (reconnecting / lost) -->
        <div id="conn-banner" class="conn-banner hidden" role="alert">
            <span class="spinner" id="banner-spinner"></span>
            <span class="banner-text" id="banner-text"></span>
            <button id="btn-reconnect" class="banner-btn">Reconnect</button>
        </div>

        <!-- Copy-selection floating button -->
        <button id="copy-selection" title="Copy selection">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></svg>
            Copy
        </button>

        <div id="terminal"></div>
    </div>

    <!-- ========================= Mobile keys ========================= -->
    <div id="mobile-keys">
        <button data-key="Escape" aria-label="Escape key">Esc</button>
        <button data-key="Tab" aria-label="Tab key">Tab</button>
        <button data-key="ArrowUp" aria-label="Arrow up">&#8593;</button>
        <button data-key="ArrowDown" aria-label="Arrow down">&#8595;</button>
        <button data-key="ArrowLeft" aria-label="Arrow left">&#8592;</button>
        <button data-key="ArrowRight" aria-label="Arrow right">&#8594;</button>
        <button data-key="CtrlC" aria-label="Control C">Ctrl+C</button>
        <button data-key="CtrlD" aria-label="Control D">Ctrl+D</button>
        <button data-key="CtrlL" aria-label="Control L">Ctrl+L</button>
        <button data-key="PageUp" aria-label="Page up">PgUp</button>
        <button data-key="PageDown" aria-label="Page down">PgDn</button>
    </div>

    <!-- ========================= Login overlay ========================= -->
    <div id="login-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div id="login-box">
            <div class="login-logo">
                <span class="logo" aria-hidden="true">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6.5l2 1.5-2 1.5M8 10h3.5"/></svg>
                </span>
            </div>
            <h2 id="login-title">ttyd-rs</h2>
            <p class="login-sub">Authentication required</p>
            <div id="login-error"></div>
            <div id="basic-auth-fields">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" autocomplete="username" />
                <label for="login-password">Password</label>
                <input type="password" id="login-password" autocomplete="current-password" />
            </div>
            <div id="token-auth-fields" style="display:none">
                <label for="login-token">Token</label>
                <input type="password" id="login-token" autocomplete="off" />
            </div>
            <button id="login-submit" type="button">Login</button>
        </div>
    </div>

    <!-- ========================= Toasts ========================= -->
    <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

    <!-- ========================= File list panel ========================= -->
    <div id="file-panel-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="File browser">
        <div id="file-panel">
            <div id="file-panel-header">
                <span class="fp-title">
                    <span class="menu-item-icon">
                        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M1.5 4.5h4l1.5 1.5h7.5v6h-13Z"/></svg>
                    </span>
                    Files
                </span>
                <label class="fp-hidden-toggle">
                    Show hidden
                    <span class="switch">
                        <input type="checkbox" id="show-hidden-toggle" aria-label="Show hidden files" />
                        <span class="switch-slider"></span>
                    </span>
                </label>
                <button id="file-panel-refresh" aria-label="Refresh file list" title="Refresh">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v2.6h-2.6"/></svg>
                </button>
                <button id="file-panel-close" aria-label="Close file panel">&times;</button>
            </div>
            <div id="file-panel-breadcrumb"></div>
            <div id="file-panel-body">
                <div class="fp-loading"><div class="spinner"></div>Loading...</div>
            </div>
        </div>
    </div>

    <!-- ========================= Drag & drop overlay ========================= -->
    <div id="drop-overlay" class="hidden">
        <div class="drop-card">
            <span class="drop-icon">
                <svg viewBox="0 0 16 16" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V3M8 3L5 6M8 3l3 3M3 13h10"/></svg>
            </span>
            <span>Drop files to upload</span>
        </div>
    </div>

    <!-- ========================= Confirm modal ========================= -->
    <div id="confirm-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-message">
        <div id="confirm-box">
            <p id="confirm-message"></p>
            <div class="confirm-actions">
                <button id="confirm-cancel">Cancel</button>
                <button id="confirm-ok">Overwrite</button>
            </div>
        </div>
    </div>

    <noscript>
        <div style="position:fixed;inset:0;background:#1e1e1e;color:#f48771;display:flex;align-items:center;justify-content:center;font-family:monospace;z-index:9999;">
            JavaScript is required to use ttyd-rs.
        </div>
    </noscript>

    <script src="/vendor/scripts/xterm.js"></script>
    <script src="/vendor/scripts/xterm-addon-fit.js"></script>
    <script src="/vendor/scripts/xterm-addon-web-links.js"></script>
    <script type="module" src="/js/main.js" crossorigin></script>
</body>
</html>
