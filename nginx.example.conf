# Resolve the real client IP:
# - Behind Cloudflare: CF-Connecting-IP (injected by CF, unspoofable by the
#   client) carries the true client address.
# - Direct (no Cloudflare): CF-Connecting-IP is absent, fall back to
#   $remote_addr, which is the client itself and likewise unspoofable.
# This keeps X-Real-IP trustworthy in both topologies, unlike relying on
# X-Forwarded-For (which a direct client can forge).
map $http_cf_connecting_ip $real_client_ip {
    default   $remote_addr;
    ~.+       $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name ttyd.example.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ttyd.example.com;

    # SSL certificate
    ssl_certificate /etc/nginx/ssl/ttyd.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/ttyd.example.com.key;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://127.0.0.1:7681;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info
        proxy_set_header Host $host;
        # Real client IP, resolved by the map above (CF-Connecting-IP when
        # behind Cloudflare, $remote_addr when direct). The application
        # (extract_real_ip) trusts X-Real-IP first, so it must carry the
        # real client IP in both topologies.
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        #
        # These MUST stay well above the server-side WebSocket heartbeat
        # timeout (90s, see src/server/websocket/pty_io.rs). The server
        # actively sends a protocol-level ping every 30s and the browser
        # answers with a pong, so a healthy idle connection always has
        # traffic flowing through nginx — but if these timeouts were shorter
        # than the heartbeat window, nginx would drop idle connections before
        # the server could keep them alive. 7d leaves ample headroom.
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Buffer settings
        proxy_buffering off;
        proxy_cache off;
    }
}
